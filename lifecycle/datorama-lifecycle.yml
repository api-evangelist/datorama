  precedents:
  - id: query-api-v1-sunset
    what: The old Query API was sunset in favour of the new Query API.
    announcement_verbatim: >-
      "We at Intelligence are hereby announcing that the old Query API will be sunset and only the
      new Query API will be available starting May 28 2019"
    sunset_date: '2019-05-28'
    rationale_verbatim: >-
      "This change is coming in order to have more efficient endpoints, clearer logs and better
      overall performance."
    migration_guide: https://developers.datorama.com/docs/query/migration-guide/
    changes:
    - Authentication moved to the user's API token in an `Authorization` header
    - Endpoints changed for both single-query and batch-query execution
    - Parameter changes documented in a comparison table
    - Rate limiting introduced (200 Query API calls/minute, 20,000 calls/day shared with the Platform API)
