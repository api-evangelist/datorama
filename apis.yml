name: Datorama
description: >-
  Datorama was a cloud-based marketing intelligence and analytics platform founded in 2012 in
  Tel Aviv and New York. It unified marketing, advertising, and sales data from thousands of
  disparate sources into a single AI-powered reporting and dashboarding layer, using its "Genius"
  machine-learning engine to automate data harmonization across ad, social, web, and CRM APIs.
  Salesforce acquired Datorama in August 2018 for a reported ~$800 million and rebranded it as
  Salesforce Marketing Cloud Intelligence (Marketing Intelligence). The standalone datorama.com
  domain now 301-redirects to the Salesforce Marketing Intelligence product page, and the former
  standalone developer/API surface has been folded into Salesforce documentation. This profile
  entered the API Evangelist network as a lightspeed-venture-partners portfolio lead.
