apis:
- name: Intelligence Platform API
  description: >-
    REST API to set up, manage and administer a Marketing Cloud Intelligence (Datorama) account —
    accounts, workspaces, users, permission sets, data streams, connectors, data source
    authentications, buckets, dimensions, harmonized/calculated/filtered measurements, data fusions,
    data lakes, dashboards, pages, reports, report schedulers, report jobs, actions, Insights Bot
    and sandbox operations. Documented for automating large setups, bulk create/update of entities,
    and exporting existing entities. Authenticated with a per-user personal API access token in the
    Authorization header; PATCH is the recommended partial update and a partial PUT clears omitted
    fields. Add the `sandbox-mode: true` header to execute against the Intelligence sandbox.
  humanURL: https://developers.datorama.com/docs/manage/introduction/
  baseURL: https://api.datorama.com/v1
  tags:
  - Marketing Intelligence
  - Administration
  - Data Management
  - Reporting
