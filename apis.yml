name: Datorama
description: >-
  Datorama was a cloud-based marketing intelligence and analytics platform founded in 2012 in Tel
  Aviv and New York. It unified marketing, advertising, and sales data from thousands of disparate
  sources into a single AI-powered reporting and dashboarding layer, using its "Genius" machine
  learning engine to automate data harmonization across ad, social, web, and CRM APIs. Salesforce
  acquired Datorama in August 2018 for a reported ~$800 million and rebranded it as Salesforce
  Marketing Cloud Intelligence. The marketing, pricing, legal, trust and support surfaces have moved
  to salesforce.com, but the developer surface is still live on the original domain: a Gatsby
  developer portal at developers.datorama.com documents an Intelligence Platform API and a
  synchronous Query API on https://api.datorama.com/v1, both authenticated with a per-user personal
  access token in an Authorization header, both rate limited per user (60 platform req/min, 200
  query req/min, 20,000 calls/day UTC) with X-PlatformRateLimit-*, X-QueryRateLimit-* and
  X-DailyQuota-* response headers, plus an asynchronous Reporting API for large exports, a
  header-switched sandbox mode, an Apps JavaScript SDK and a `dato` CLI on npm, a custom-connector
  framework, and — new in July 2026 — a first-party MCP server (@datorama/mci-mcp-sdk) that proxies
  MCP JSON-RPC to a tenant /api/mcp endpoint using an OAuth2 service-account key. No OpenAPI,
  AsyncAPI, GraphQL SDL, llms.txt, /.well-known/ document or A2A agent card is published anywhere on
  the surface. This profile entered the API Evangelist network as a lightspeed-venture-partners
  portfolio lead.
