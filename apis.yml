- name: Intelligence Query API
  description: >-
    Synchronous JSON query API for reading harmonized Marketing Cloud Intelligence (Datorama) data
    out into any other platform, including all classifications and calculations. POST /v1/query and
    POST /v1/query-batch accept a workspace, date range, dimensions, measurements, filters, sort and
    top-results shape; add useSystemNames=true to receive system names instead of display names. It
    has a 60-second timeout and is intended for result sets up to ~600,000 rows — larger workloads
    move to the asynchronous Reporting API. Query-parse failures return HTTP 422; runtime failures
    return HTTP 200 with a populated `errors` property, so a client must inspect `errors` before
    reading results.
  humanURL: https://developers.datorama.com/docs/query/introduction/
  baseURL: https://api.datorama.com/v1
