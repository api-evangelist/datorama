generated: '2026-08-12'
method: searched
source: https://developers.datorama.com/docs/manage/
docs_root: https://developers.datorama.com/docs/manage/
note: >-
  Entity-relationship graph for the Intelligence (Datorama) Platform API. There is no OpenAPI to
  derive from, so this is read from the object tables the developer portal publishes on each
  /docs/manage/<entity>/ page — every relationship below is backed by an id-reference field that
  appears verbatim in that entity's own field table. Field tables render; the endpoint (method +
  path) tables on the same pages do NOT, because the deployed Gatsby bundle is missing the modules
  that hold them, so operations are not enumerated here.
id_convention:
  type: integer
  prefixes: none
  note: >-
    All Intelligence entity ids are plain integers. There are no typed/prefixed ids (no `ws_`,
    `acc_`), so an id is only meaningful alongside its entity type.
timestamps:
  type: unix-epoch-milliseconds
  fields: [createTime, updateTime]
common_fields:
  name: entity history
  applies_to: every Platform API entity
  fields: [createUserId, createUser, createTime, updateUserId, updateUser, updateTime]
  writable: false
hierarchy:
  - Account
  - Workspace (belongs to Account; may be an "executive workspace" aggregating sub-workspaces)
  - "Data plane: Data Streams -> Buckets -> Dimensions / Measurements"
  - "Presentation plane: Dashboards -> Pages -> Reports / Report Schedulers -> Report Jobs"
entities:
- name: Account
  docs: https://developers.datorama.com/docs/manage/accounts/
  references: [cultureId, currencyId, timezoneId]
  relationships:
  - {type: has_many, target: Workspace, via: accountId}
  - {type: has_many, target: User, via: accountId}
  - {type: has_many, target: PermissionSet, via: accountId}
  - {type: belongs_to, target: Currency, via: currencyId}
  - {type: belongs_to, target: Culture, via: cultureId}
  - {type: belongs_to, target: TimeZone, via: timezoneId}
- name: Workspace
  docs: https://developers.datorama.com/docs/manage/workspaces/
  references: [accountId, verticalId, colorSchemeId, currencyId, accountCurrencyId, cultureId, timezoneId, dashboardThemeId]
  relationships:
  - {type: belongs_to, target: Account, via: accountId}
  - {type: belongs_to, target: Vertical, via: verticalId}
  - {type: belongs_to, target: Currency, via: currencyId}
  - {type: belongs_to, target: TimeZone, via: timezoneId}
  - {type: belongs_to, target: Culture, via: cultureId}
  - {type: has_many, target: Workspace, via: subWorkspaces, note: only when executiveWorkspace is true}
  - {type: has_many, target: Bucket, via: visibleBuckets}
  - {type: has_many, target: DataStream, via: workspaceId}
  - {type: has_many, target: Dashboard, via: workspaceId}
  - {type: has_many, target: Page, via: workspaceId}
  - {type: has_many, target: Report, via: workspaceId}
  key_flags: [costCenterEnabled, executiveWorkspace, customCalendarEnabled, customLocationEnabled, applyBlindPeriods, archivingEnabled, liteConnectEnabled, workflowsEnabled, actionCenterEnabled, balanceBudgetToolEnabled, hourlyProcessingAllowed]
- name: User
  docs: https://developers.datorama.com/docs/manage/users/
  references: [accountId, currentAccountId, languageId]
  relationships:
  - {type: belongs_to, target: Account, via: accountId}
  - {type: has_many, target: PermissionSet, via: permissionSetId}
- name: PermissionSet
  docs: https://developers.datorama.com/docs/manage/permission-sets/
  references: [accountId, workspaceId, permissionSetId]
  relationships:
