note: >-
  Datorama is now Salesforce Marketing Cloud Intelligence. The first-party client tooling is
  still published under the @datorama npm scope by Salesforce/Datorama maintainer accounts, and
  the developer portal at developers.datorama.com is the document that names them. Versions and
  publish dates below are read from the registries, not from prose. The decay signal here is
  loud: every app/SDK package last shipped in 2023 or earlier, while the one 2026 release in the
  scope is a brand-new MCP server (@datorama/mci-mcp-sdk, 2026-07-21) — the tooling investment
  has moved from the JS app SDK to the agent surface.
